services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  db:
    image: postgres:16
    container_name: smartscrape_db
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=admin
      - POSTGRES_DB=smartscrape
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data: